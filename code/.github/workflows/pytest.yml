name: Digital Wallet Unit Tests

# ADVANCED FEATURE - fewer, smarter test runs
# 1. paths filter      : only run when wallet code, tests, requirements or this
#                        workflow change (README/docs edits do not trigger a run).
# 2. branches filter   : push runs only on main; feature branches are tested
#                        once, through their pull request, not on every push.
# 3. pull_request      : tests run at the merge gate (PR into main).
# 4. concurrency       : a newer push to the same branch/PR cancels the older,
#                        still-running job (rapid pushes / AI-assisted commits).
# 5. pip cache + timeout: faster runs, and a hung job cannot burn minutes.
# 6. workflow_dispatch : manual run button for demos.
on:
  push:
    branches: [main]
    paths:
      - "06_digital_wallet/**.py"
      - "06_digital_wallet/requirements.txt"
      - "pytest.ini"
      - ".github/workflows/pytest.yml"
  pull_request:
    branches: [main]
    paths:
      - "06_digital_wallet/**.py"
      - "06_digital_wallet/requirements.txt"
      - "pytest.ini"
      - ".github/workflows/pytest.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 06_digital_wallet/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r 06_digital_wallet/requirements.txt

      - name: Run pytest
        run: python -m pytest --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
